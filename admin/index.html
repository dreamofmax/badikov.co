<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Max Badikov</title>
<meta name="robots" content="noindex, nofollow">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
html, body { height: 100%; font-family: var(--sans); background: #fff; color: #000; font-size: 13px; }
.shell { display: flex; min-height: 100vh; }

.sidebar { width: 230px; min-width: 230px; padding: 30px 18px; border-right: 1px solid #eee; }
.brand { font-size: 14px; font-weight: 600; letter-spacing: 0.02em; margin-bottom: 4px; }
.brand-sub { font-size: 10.5px; color: #999; letter-spacing: 0.04em; margin-bottom: 26px; }
.sec-group-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #999; margin: 18px 0 8px; }
.sec-btn {
  display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  font-family: var(--sans); font-size: 12px; padding: 7px 8px; border-radius: 4px; color: #222;
}
.sec-btn:hover { background: #f5f5f5; }
.sec-btn.active { background: #000; color: #fff; }
.new-proj-btn {
  margin-top: 22px; width: 100%; padding: 9px 10px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  background: #fff; border: 1px solid #000; cursor: pointer; font-family: var(--sans);
}
.new-proj-btn:hover { background: #000; color: #fff; }

.content { flex: 1; padding: 34px 40px; overflow-y: auto; max-height: 100vh; }
.content-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.content-sub { font-size: 11px; color: #999; margin-bottom: 24px; }
.empty-state { color: #999; font-size: 12px; padding: 40px 0; }

.dropzone {
  border: 1.5px dashed #ccc; border-radius: 6px; padding: 26px; text-align: center;
  color: #888; font-size: 12px; margin-bottom: 26px; cursor: pointer; transition: border-color .15s, background .15s;
}
.dropzone.drag { border-color: #000; background: #fafafa; color: #000; }
.dropzone input { display: none; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
.cell {
  border: 1px solid #eee; border-radius: 6px; overflow: hidden; background: #fff; cursor: grab;
}
.cell.dragging { opacity: 0.4; }
.cell.drop-target { outline: 2px solid #000; outline-offset: -2px; }
.cell-img-wrap { aspect-ratio: 4/3; background: #eee; overflow: hidden; }
.cell-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cell-body { padding: 8px; }
.cap-input {
  width: 100%; border: none; border-bottom: 1px solid #eee; font-size: 11px; font-family: var(--sans);
  padding: 4px 2px; outline: none; margin-bottom: 6px;
}
.cap-input:focus { border-bottom-color: #000; }
.cell-actions { display: flex; align-items: center; gap: 6px; }
.move-select { flex: 1; font-size: 10.5px; font-family: var(--sans); border: 1px solid #eee; padding: 3px; }
.del-btn { background: none; border: none; color: #c33; cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; }
.del-btn:hover { color: #900; }

.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; align-items: center; justify-content: center; }
.modal-bg.visible { display: flex; }
.modal { background: #fff; width: 420px; max-width: 92vw; max-height: 88vh; overflow-y: auto; padding: 28px; border-radius: 8px; }
.modal h2 { font-size: 15px; margin-bottom: 18px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: #999; margin-bottom: 5px; }
.field input[type=text], .field input[type=password], .field textarea {
  width: 100%; font-family: var(--sans); font-size: 12.5px; padding: 7px 8px; border: 1px solid #ddd; border-radius: 4px; outline: none;
}
.field input:focus, .field textarea:focus { border-color: #000; }
.field textarea { min-height: 80px; resize: vertical; }
.field-check { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 8px; }
.hint { font-size: 10.5px; color: #999; margin-top: 4px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.btn { font-family: var(--sans); font-size: 11.5px; padding: 8px 16px; cursor: pointer; border-radius: 4px; }
.btn-primary { background: #000; color: #fff; border: 1px solid #000; }
.btn-secondary { background: #fff; color: #000; border: 1px solid #ddd; }
.error-text { color: #c33; font-size: 11.5px; margin-top: 10px; min-height: 14px; }
.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: #000; color: #fff; font-size: 12px; padding: 9px 16px; border-radius: 6px;
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 100;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="shell">
  <div class="sidebar">
    <div class="brand">Max Badikov</div>
    <div class="brand-sub">Admin — local only</div>
    <div id="sectionList"></div>
    <button class="new-proj-btn" id="newProjBtn">+ New Project</button>
  </div>
  <div class="content" id="content">
    <div class="empty-state">Select a section on the left.</div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>New Project</h2>
    <div class="field">
      <label>Title</label>
      <input type="text" id="npTitle" placeholder="e.g. Some New Series">
    </div>
    <div class="field">
      <label>Key (URL slug)</label>
      <input type="text" id="npKey" placeholder="some-new-series">
      <div class="hint">Lowercase letters, numbers and hyphens only.</div>
    </div>
    <div class="field-check">
      <input type="checkbox" id="npPwEnabled">
      <label for="npPwEnabled" style="margin:0;text-transform:none;letter-spacing:0;font-size:12px;color:#000;">Password protected</label>
    </div>
    <div class="field" id="npPwField" style="display:none;">
      <label>Password</label>
      <input type="password" id="npPwValue">
    </div>
    <div class="field-check">
      <input type="checkbox" id="npAboutEnabled">
      <label for="npAboutEnabled" style="margin:0;text-transform:none;letter-spacing:0;font-size:12px;color:#000;">Add "About" text</label>
    </div>
    <div class="field" id="npAboutField" style="display:none;">
      <label>About paragraphs (one per line)</label>
      <textarea id="npAboutText" placeholder="One paragraph per line.&#10;Use [Link text](https://...) for a link line."></textarea>
    </div>
    <div class="error-text" id="npError"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="npCancel">Cancel</button>
      <button class="btn btn-primary" id="npCreate">Create</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let MANIFEST = null;
let currentKey = null;
let dragFromIndex = null;

const FLAT_LABELS = { commissioned: 'Commissioned', portraits: 'Portraits', personal: 'Personal' };

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#c33' : '#000';
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function allSectionKeys() {
  const keys = Object.keys(MANIFEST.projects || {});
  return keys.concat(['commissioned', 'portraits', 'personal']);
}
function sectionTitle(key) {
  if (MANIFEST.projects && MANIFEST.projects[key]) return MANIFEST.projects[key].title;
  return FLAT_LABELS[key] || key;
}
function sectionImages(key) {
  if (MANIFEST.projects && MANIFEST.projects[key]) return MANIFEST.projects[key].images;
  return MANIFEST[key] || [];
}

async function loadManifest(preserveSelection) {
  MANIFEST = await api('GET', '/admin/api/manifest');
  renderSidebar();
  if (preserveSelection && currentKey && allSectionKeys().includes(currentKey)) {
    renderContent(currentKey);
  }
}

function renderSidebar() {
  const list = document.getElementById('sectionList');
  list.innerHTML = '';

  const projLabel = document.createElement('div');
  projLabel.className = 'sec-group-label'; projLabel.textContent = 'Projects';
  list.appendChild(projLabel);
  Object.keys(MANIFEST.projects || {}).forEach(key => list.appendChild(sectionButton(key)));

  const flatLabel = document.createElement('div');
  flatLabel.className = 'sec-group-label'; flatLabel.textContent = 'Galleries';
  list.appendChild(flatLabel);
  ['commissioned', 'portraits', 'personal'].forEach(key => list.appendChild(sectionButton(key)));
}

function sectionButton(key) {
  const btn = document.createElement('button');
  btn.className = 'sec-btn' + (key === currentKey ? ' active' : '');
  btn.textContent = sectionTitle(key) + ' (' + sectionImages(key).length + ')';
  btn.addEventListener('click', () => { currentKey = key; renderSidebar(); renderContent(key); });
  return btn;
}

function renderContent(key) {
  const content = document.getElementById('content');
  content.innerHTML = '';

  const title = document.createElement('div');
  title.className = 'content-title'; title.textContent = sectionTitle(key);
  content.appendChild(title);

  const sub = document.createElement('div');
  sub.className = 'content-sub'; sub.textContent = key + ' · ' + sectionImages(key).length + ' image(s)';
  content.appendChild(sub);

  content.appendChild(buildDropzone(key));
  content.appendChild(buildGrid(key));
}

function buildDropzone(key) {
  const zone = document.createElement('div');
  zone.className = 'dropzone';
  zone.textContent = 'Drag photos here, or click to choose files';
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
  zone.appendChild(input);

  zone.addEventListener('click', () => input.click());
  input.addEventListener('change', () => { uploadFiles(key, input.files); input.value = ''; });

  ['dragenter', 'dragover'].forEach(evt => zone.addEventListener(evt, e => {
    e.preventDefault(); zone.classList.add('drag');
  }));
  ['dragleave', 'drop'].forEach(evt => zone.addEventListener(evt, e => {
    e.preventDefault(); zone.classList.remove('drag');
  }));
  zone.addEventListener('drop', e => {
    if (e.dataTransfer.files.length) uploadFiles(key, e.dataTransfer.files);
  });

  return zone;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadFiles(key, fileList) {
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  toast('Uploading ' + files.length + ' image(s)…');
  for (const file of files) {
    try {
      const dataBase64 = await fileToBase64(file);
      await api('POST', '/admin/api/upload', { sectionKey: key, filename: file.name, dataBase64 });
    } catch (e) {
      toast('Upload failed: ' + e.message, true);
    }
  }
  toast('Upload complete');
  await loadManifest(true);
}

function buildGrid(key) {
  const images = sectionImages(key);
  if (!images.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state'; empty.textContent = 'No images yet — upload some above.';
    return empty;
  }

  const grid = document.createElement('div');
  grid.className = 'grid';

  images.forEach((img, idx) => {
    const cell = document.createElement('div');
    cell.className = 'cell'; cell.draggable = true; cell.dataset.index = idx;

    const imgWrap = document.createElement('div'); imgWrap.className = 'cell-img-wrap';
    const im = document.createElement('img'); im.src = '/' + img.src; im.loading = 'lazy';
    imgWrap.appendChild(im); cell.appendChild(imgWrap);

    const body = document.createElement('div'); body.className = 'cell-body';

    const capInput = document.createElement('input');
    capInput.className = 'cap-input'; capInput.type = 'text'; capInput.placeholder = 'Caption';
    capInput.value = img.cap || '';
    capInput.addEventListener('keydown', e => { if (e.key === 'Enter') capInput.blur(); });
    capInput.addEventListener('blur', async () => {
      if (capInput.value === (img.cap || '')) return;
      try { await api('POST', '/admin/api/caption', { sectionKey: key, index: idx, cap: capInput.value }); img.cap = capInput.value; toast('Caption saved'); }
      catch (e) { toast('Failed: ' + e.message, true); }
    });
    body.appendChild(capInput);

    const actions = document.createElement('div'); actions.className = 'cell-actions';

    const moveSelect = document.createElement('select'); moveSelect.className = 'move-select';
    const noneOpt = document.createElement('option'); noneOpt.value = ''; noneOpt.textContent = 'Move to…';
    moveSelect.appendChild(noneOpt);
    allSectionKeys().forEach(k => {
      if (k === key) return;
      const opt = document.createElement('option'); opt.value = k; opt.textContent = sectionTitle(k);
      moveSelect.appendChild(opt);
    });
    moveSelect.addEventListener('change', async () => {
      if (!moveSelect.value) return;
      try {
        await api('POST', '/admin/api/move-image', { fromSection: key, index: idx, toSection: moveSelect.value });
        toast('Moved to ' + sectionTitle(moveSelect.value));
        await loadManifest(true);
      } catch (e) { toast('Failed: ' + e.message, true); }
    });
    actions.appendChild(moveSelect);

    const delBtn = document.createElement('button'); delBtn.className = 'del-btn'; delBtn.textContent = '×';
    delBtn.title = 'Delete image';
    delBtn.addEventListener('click', async () => {
      if (!confirm('Delete this image? This removes the file from disk.')) return;
      try {
        await api('POST', '/admin/api/delete-image', { sectionKey: key, index: idx });
        toast('Deleted');
        await loadManifest(true);
      } catch (e) { toast('Failed: ' + e.message, true); }
    });
    actions.appendChild(delBtn);

    body.appendChild(actions);
    cell.appendChild(body);

    // drag-to-reorder within the same section
    cell.addEventListener('dragstart', e => {
      dragFromIndex = idx; cell.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    cell.addEventListener('dragend', () => { cell.classList.remove('dragging'); });
    cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drop-target'); });
    cell.addEventListener('dragleave', () => cell.classList.remove('drop-target'));
    cell.addEventListener('drop', async e => {
      e.preventDefault(); cell.classList.remove('drop-target');
      if (dragFromIndex === null || dragFromIndex === idx) return;
      try {
        await api('POST', '/admin/api/reorder', { sectionKey: key, fromIndex: dragFromIndex, toIndex: idx });
        dragFromIndex = null;
        await loadManifest(true);
      } catch (e2) { toast('Failed: ' + e2.message, true); }
    });

    grid.appendChild(cell);
  });

  return grid;
}

// ─── NEW PROJECT MODAL ──────────────────
const modalBg = document.getElementById('modalBg');
document.getElementById('newProjBtn').addEventListener('click', () => {
  document.getElementById('npTitle').value = '';
  document.getElementById('npKey').value = '';
  document.getElementById('npPwEnabled').checked = false;
  document.getElementById('npPwValue').value = '';
  document.getElementById('npPwField').style.display = 'none';
  document.getElementById('npAboutEnabled').checked = false;
  document.getElementById('npAboutText').value = '';
  document.getElementById('npAboutField').style.display = 'none';
  document.getElementById('npError').textContent = '';
  modalBg.classList.add('visible');
});
document.getElementById('npCancel').addEventListener('click', () => modalBg.classList.remove('visible'));
document.getElementById('npTitle').addEventListener('input', e => {
  const keyField = document.getElementById('npKey');
  if (!keyField.dataset.touched) {
    keyField.value = e.target.value.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }
});
document.getElementById('npKey').addEventListener('input', e => { e.target.dataset.touched = '1'; });
document.getElementById('npPwEnabled').addEventListener('change', e => {
  document.getElementById('npPwField').style.display = e.target.checked ? 'block' : 'none';
});
document.getElementById('npAboutEnabled').addEventListener('change', e => {
  document.getElementById('npAboutField').style.display = e.target.checked ? 'block' : 'none';
});

function parseAboutText(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const m = line.match(/^\[(.+?)\]\((https?:\/\/[^\s)]+)\)$/);
    return m ? { text: m[1], href: m[2] } : line;
  });
}

document.getElementById('npCreate').addEventListener('click', async () => {
  const title = document.getElementById('npTitle').value.trim();
  const key = document.getElementById('npKey').value.trim();
  const pwEnabled = document.getElementById('npPwEnabled').checked;
  const pwValue = document.getElementById('npPwValue').value;
  const aboutEnabled = document.getElementById('npAboutEnabled').checked;
  const aboutText = document.getElementById('npAboutText').value;
  const errEl = document.getElementById('npError');
  errEl.textContent = '';

  const body = {
    title, key,
    password: { enabled: pwEnabled, value: pwValue },
    about: aboutEnabled ? { title, paragraphs: parseAboutText(aboutText) } : null
  };

  try {
    await api('POST', '/admin/api/create-project', body);
    modalBg.classList.remove('visible');
    toast('Project created');
    currentKey = key;
    await loadManifest(true);
  } catch (e) {
    errEl.textContent = e.message;
  }
});

loadManifest();
</script>
</body>
</html>
